name: ALP CI
run-name: ${{ github.actor }} is running the ALP CI

on:
  push:
    branches:
      - "*"  # All branches
  pull_request:
    branches:
      - "*"  # All branches

jobs:
  # 1) Format Check Job
  check-format:
    name: "Format Check Job"
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      # Only run brew install if it's macOS
      - name: Install clang-tidy (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          export PATH="$(brew --prefix llvm)/bin:$PATH"

      - name: Verify Clang-Tidy Installation
        run: |
          which clang-tidy || echo "clang-tidy not found"
          clang-tidy --version || true

      - name: Check Code Format
        run: |
          echo "This is where you'd run clang-format or clang-tidy checks."
          clang-tidy --version

  # 2) Build and Test Job
  build-and-test:
    name: "Build and Test Job"
    needs: check-format
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        platform: [ ubuntu-latest, macos-latest ]
        build_type: [ Debug, Release ]
        cxx: [ clang++ ]

    steps:
      - uses: actions/checkout@v4

      # Again, install clang-tidy on macOS
      - name: Install clang-tidy (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          export PATH="$(brew --prefix llvm)/bin:$PATH"

      - name: Verify Clang-Tidy Installation
        run: |
          which clang-tidy || echo "clang-tidy not found"
          clang-tidy --version || true

      - name: Set Up Build Directory
        run: mkdir build

      - name: Configure CMake
        run: cmake -S . -B build -DALP_BUILD_TESTING=ON -DALP_ENABLE_CLANG_TIDY=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        env:
          CXX: ${{ matrix.cxx }}

      - name: Build Project
        run: cmake --build build -j 16

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure -j 16

  # 3) Benchmarking Job
  build-benchmark:
    name: "Build Benchmarking"
    needs: build-and-test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        platform: [ ubuntu-latest, macos-latest ]
        build_type: [ Release ]
        cxx: [ clang++ ]

    steps:
      - uses: actions/checkout@v4

      # Install clang-tidy on macOS
      - name: Install clang-tidy (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          export PATH="$(brew --prefix llvm)/bin:$PATH"

      - name: Verify Clang-Tidy Installation
        run: |
          which clang-tidy || echo "clang-tidy not found"
          clang-tidy --version || true

      - name: Set Up Build Directory
        run: mkdir build

      - name: Configure CMake with Benchmarking
        run: cmake -S . -B build -DALP_BUILD_BENCHMARKING=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        env:
          CXX: ${{ matrix.cxx }}

      - name: Build Project
        run: cmake --build build -j 16
